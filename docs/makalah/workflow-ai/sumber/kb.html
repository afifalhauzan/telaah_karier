<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
#br{left:140px;top:229px;width:680px;height:622px;overflow:hidden}
#bar{height:60px;background:#f2f3f5;display:flex;align-items:center;padding:0 22px;gap:10px;border-bottom:2px solid #e1e2e4}
.d{width:14px;height:14px;border-radius:50%;background:#d4d6da}
#url{margin-left:14px;flex:1;height:36px;background:#fff;border-radius:18px;display:flex;align-items:center;padding:0 18px;font-size:20px;color:var(--muted)}
.art{position:absolute;width:632px;border-radius:16px;overflow:hidden;box-shadow:0 0 0 2px #e1e2e4;background:#fff;transform-origin:center}
.art img{display:block;width:100%}
#scan{width:640px;height:6px;background:linear-gradient(90deg,transparent,#0e9e9e,transparent);box-shadow:0 0 22px #0e9e9e;border-radius:3px}
#card{left:880px;width:560px;padding:30px 32px;border-radius:24px;background:#fff;box-shadow:0 0 0 2px #0e9e9e,0 8px 30px rgba(14,158,158,.12)}
#card .kk{font-size:20px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#0e9e9e}
#card .tt{font-size:28px;font-weight:700;line-height:1.3;margin:8px 0 22px}
.row{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.k{width:104px;flex:none;font-size:21px;color:var(--muted);padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.bd{font-size:21px;font-weight:600;border-radius:999px;padding:5px 14px;border:2px solid}
.bd.t{background:#e7f5f5;color:#0a7f80;border-color:#b7e2e2}
.bd.r{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
#vec{display:flex;gap:5px;align-items:flex-end;height:44px}
#vec span{width:13px;border-radius:3px;background:#0e9e9e}
.mini{position:absolute;width:300px;padding:18px 20px;border-radius:18px;background:#fff;box-shadow:0 0 0 2px #0e9e9e;transform:translate(-50%,-50%)}
.mini .kk{font-size:14px;font-weight:600;letter-spacing:.14em;color:#0e9e9e}
.mini .tt{font-size:20px;font-weight:700;margin:4px 0 10px;white-space:nowrap}
.mini .bd{font-size:15px;padding:3px 10px}
#kb{left:1640px;top:540px;width:280px;height:340px;transform:translate(-50%,-50%)}
#glow{left:1640px;top:540px;width:460px;height:460px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(14,158,158,.28),transparent)}
#cnt{left:1640px;top:560px;transform:translate(-50%,-50%);text-align:center;color:#fff}
#cnt b{display:block;font-size:72px;font-weight:800;line-height:1}
#cnt span{font-size:20px;font-weight:600;opacity:.85}
#kbl{left:1640px;top:740px;transform:translateX(-50%);font-size:30px;font-weight:700;white-space:nowrap}
</style></head><body><div id="stage">
<div id="glow" class="abs"></div>
<div id="br" class="abs card"><div id="bar"><span class="d"></span><span class="d"></span><span class="d"></span><div id="url" class="mono">turnbackhoax.id</div></div><div id="scan" class="abs"></div></div>
<svg id="kb" class="abs" viewBox="0 0 280 340"><path d="M10 50v240a130 40 0 0 0 260 0V50" fill="#0e9e9e"/><ellipse cx="140" cy="50" rx="130" ry="40" fill="#3fb3b3"/><ellipse id="mouth" cx="140" cy="50" rx="100" ry="26" fill="#065f60" opacity=".5"/><path d="M10 130a130 40 0 0 0 260 0M10 210a130 40 0 0 0 260 0" fill="none" stroke="#87cfcf" stroke-width="3" opacity=".7"/></svg>
<div id="cnt" class="abs"><b id="cn">0</b><span>kartu kasus</span></div>
<div id="kbl" class="abs"><i>Knowledge Base</i></div>
<div id="card" class="abs">
 <div class="kk">Kartu kasus</div>
 <div class="tt">Tautan lowongan palsu Komatsu Indonesia</div>
 <div class="row" id="r0"><div class="k">Modus</div><div class="chips"><span class="bd r">impersonasi</span></div></div>
 <div class="row" id="r1"><div class="k">Entitas</div><div class="chips"><span class="bd t">PT Komatsu Indonesia</span></div></div>
 <div class="row" id="r2"><div class="k">Kanal</div><div class="chips"><span class="bd t">tautan pendaftaran</span></div></div>
 <div class="row" id="r3"><div class="k">Ciri</div><div class="chips"><span class="bd t">bukan laman karier resmi</span></div></div>
 <div class="row" id="r4" style="margin-bottom:0"><div class="k">Embedding</div><div id="vec"></div></div>
</div>
</div>
<script src="common.js"></script>
<script>
const SRC=['art1.png','art2.png','art3.png'];
const arts=SRC.map((s,i)=>{const d=document.createElement('div');d.className='art';d.innerHTML=`<img src="${s}">`;$('stage').appendChild(d);return d});
const MINI=[null,['PT Kaltim Prima Coal'],['Nestlé Indonesia']];
const minis=[1,2].map(i=>{const d=document.createElement('div');d.className='mini';d.innerHTML=`<div class="kk">KARTU KASUS</div><div class="tt">${MINI[i][0]}</div><div class="chips"><span class="bd r">impersonasi</span></div>`;$('stage').appendChild(d);return d});
const VEC=[.55,.9,.3,.75,.45,1,.6,.25,.8,.4,.7,.35,.95,.5,.65,.3,.85,.45,.6,.8];
VEC.forEach(v=>{const s=document.createElement('span');s.dataset.h=v;$('vec').appendChild(s)});
const AX=164, AY=[313,511,709]; // art slots inside browser (top-left)
const CH=$('card').offsetHeight; $('card').style.top=(540-CH/2)+'px';
const CX=880+280, CY=540;
const DUR=12;
window.render=function(t){
 const bi=eo(p(t,.1,.7)); set($('br'),{opacity:bi,transform:`translateY(${(1-bi)*30}px)`});
 const ki=eo(p(t,.3,.9)); ['kb','cnt','kbl'].forEach(id=>$(id).style.opacity=ki);
 arts.forEach((a,i)=>{const h=a.offsetHeight||158;const ap=eo(p(t,.5+i*.2,1.0+i*.2));
   let x=AX,y=AY[i],sc=1,op=ap,flt='none';
   if(i==0){ // lift to centre and dissolve into card
     const lift=eio(p(t,3.0,3.8)); x=lerp(AX,CX-316,lift); y=lerp(AY[0],CY-h/2,lift); sc=lerp(1,.9,lift); op=ap*(1-p(t,3.7,4.1));
   } else {
     const st=i==1?6.6:8.0; const k=p(t,st,st+.6); sc=1+.04*Math.sin(k*Math.PI); op=ap;
   }
   const done=[4.0,7.1,8.5][i]; flt=t>done?'grayscale(1) opacity(.45)':'none';
   set(a,{left:x+'px',top:y+'px',opacity:op,transform:`scale(${sc})`,filter:i==0&&t<3.7?'none':flt});
   if(i==0&&t>4.1){set(a,{left:AX+'px',top:AY[0]+'px',transform:'none',opacity:eo(p(t,4.1,4.5))})}
   const sel=[[2.0,3.0],[6.2,6.7],[7.6,8.1]][i]; a.style.boxShadow=t>=sel[0]&&t<sel[1]+.3?'0 0 0 4px #0e9e9e':'0 0 0 2px #e1e2e4'});
 // scan over article 1
 const s=p(t,1.8,2.9); set($('scan'),{opacity:t>1.8&&t<3.0?1:0,left:'20px',top:(AY[0]-229+lerp(0,160,eio(s)))+'px'});
 // card
 const ci=eo(p(t,3.7,4.3)); const fly=eio(p(t,5.6,6.3));
 set($('card'),{opacity:ci*(1-p(t,6.1,6.3)),transform:`translate(${fly*(1640-CX)}px,${fly*(500-CY)}px) scale(${lerp(.94+.06*ci,.15,fly)})`});
 for(let i=0;i<4;i++){const k=eo(p(t,4.2+i*.22,4.55+i*.22));set($('r'+i),{opacity:k,transform:`translateX(${(1-k)*20}px)`})}
 set($('r4'),{opacity:eo(p(t,5.0,5.2))});
 [...$('vec').children].forEach((sp,i)=>{sp.style.height=(6+38*sp.dataset.h*eo(cl(p(t,5.0,5.6)*1.6-i*.03)))+'px'});
 // minis for 2 and 3
 [[0,6.6],[1,8.0]].forEach(([m,st])=>{const el=minis[m];const k=p(t,st,st+1.4);
   const x0=AX+316,y0=AY[m+1]+80,x1=CX,y1=CY,x2=1640,y2=470;
   let x,y,sc;if(k<.45){const q=eio(k/.45);x=lerp(x0,x1,q);y=lerp(y0,y1,q);sc=lerp(.6,1.2,q)}else if(k<.6){x=x1;y=y1;sc=1.2}else{const q=eio((k-.6)/.4);x=lerp(x1,x2,q);y=lerp(y1,y2,q)-Math.sin(q*Math.PI)*90;sc=lerp(1.2,.3,q)}
   set(el,{left:x+'px',top:y+'px',opacity:(k>0&&k<1)?1:0,transform:`translate(-50%,-50%) scale(${sc})`})});
 const hits=[6.25,8.0,9.4]; const n=hits.filter(h=>t>=h).length; $('cn').textContent=n;
 const pulse=Math.max(0,...hits.map(h=>t>=h?Math.exp(-(t-h)*4):0));
 set($('glow'),{opacity:.35+pulse*.65,transform:`translate(-50%,-50%) scale(${1+pulse*.12})`});
 $('kb').style.transform=`translate(-50%,-50%) scale(${1+pulse*.05})`;
};
render(0);
</script></body></html>
