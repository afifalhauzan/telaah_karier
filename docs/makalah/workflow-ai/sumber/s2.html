<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.node{position:absolute;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 0 0 2px #e1e2e4,0 4px 20px rgba(23,35,44,.06);transform:translate(-50%,-50%)}
#hub{width:200px;height:200px;border-radius:50%;background:var(--blue)}
.dest{width:140px;height:140px;border-radius:36px}
.dl{position:absolute;font-size:26px;font-weight:600;color:var(--muted);transform:translateX(-50%);white-space:nowrap;text-align:center}
svg#paths{position:absolute;left:0;top:0}
.inp{position:absolute;left:400px;top:540px;transform:translate(-50%,-50%);transform-origin:center}
#poster{width:330px;height:430px;border-radius:18px;background:linear-gradient(160deg,#ffcc3d,#ff8a3d);padding:30px 28px;color:#2b1a00;box-shadow:0 0 0 2px #e1e2e4,0 4px 20px rgba(23,35,44,.06)}
#poster .h{font-size:40px;font-weight:900;line-height:1.05;letter-spacing:-1px}
#poster .co{font-size:22px;font-weight:700;margin-top:14px;background:#2b1a00;color:#ffcc3d;display:inline-block;padding:4px 10px;border-radius:6px}
#poster .pos{font-size:28px;font-weight:800;margin-top:22px}
#poster .gj{font-size:24px;font-weight:700;margin-top:6px}
#poster .wa{position:absolute;left:28px;right:28px;bottom:28px;background:#fff;border-radius:12px;padding:10px 14px;font-size:22px;font-weight:700;display:flex;gap:10px;align-items:center}
.bub{max-width:440px;background:var(--blue);color:#fff;border-radius:28px 28px 8px 28px;padding:26px 30px;font-size:28px;line-height:1.5;box-shadow:0 0 0 2px #e1e2e4,0 4px 20px rgba(23,35,44,.06)}
</style></head><body><div id="stage">
<svg id="paths" width="1920" height="1080"></svg>
<div id="i0" class="inp"><div id="poster"><div class="h">LOWONGAN<br>KERJA</div><div class="co">PT MAJU JAYA</div><div class="pos">Admin Gudang</div><div class="gj">Gaji Rp6 juta</div><div class="wa"></div></div></div>
<div id="i1" class="inp"><div class="bub">Saya sudah lolos interview, sekarang diminta transfer Rp500 ribu untuk seragam.</div></div>
<div id="i2" class="inp"><div class="bub">Kenapa risikonya tinggi?</div></div>
<div id="hub" class="node"></div>
<div id="d0" class="node dest"></div><div id="d1" class="node dest"></div><div id="d2" class="node dest"></div>
<div id="l0" class="dl">Risiko lowongan</div><div id="l1" class="dl">Alur rekrutmen</div><div id="l2" class="dl">Pertanyaan lanjutan</div>
</div>
<script src="common.js"></script>
<script>
frame(2,'Router');
$('poster').querySelector('.wa').innerHTML=icon('phone',24,'#059669',2.4)+'0812 3456 7890';
const HUB=[960,540],D=[[1520,290],[1520,540],[1520,790]];
const place=(id,[x,y])=>set($(id),{left:x+'px',top:y+'px'});
place('hub',HUB);D.forEach((d,i)=>{place('d'+i,d);set($('l'+i),{left:d[0]+'px',top:(d[1]+88)+'px'})});
$('hub').innerHTML=icon('router',110,'#fff',1.8);
['brief','flow','question'].forEach((n,i)=>$('d'+i).innerHTML=icon(n,76,'#0a7f80',1.8));
$('paths').innerHTML=`<path d="M565 540 L${HUB[0]} ${HUB[1]}" stroke="#e1e2e4" stroke-width="6" fill="none"/>`+D.map((d,i)=>`<path d="M${HUB[0]} ${HUB[1]} C${HUB[0]+220} ${HUB[1]} ${d[0]-220} ${d[1]} ${d[0]} ${d[1]}" stroke="#e1e2e4" stroke-width="6" fill="none"/><path id="pp${i}" d="M${HUB[0]} ${HUB[1]} C${HUB[0]+220} ${HUB[1]} ${d[0]-220} ${d[1]} ${d[0]} ${d[1]}" stroke="#e1e2e4" stroke-width="6" fill="none"/>`).join('');
const DUR=10.5; const SEG=[[0.6,3.8],[3.8,7.0],[7.0,10.2]];
window.render=function(t){
 frameRender(t,DUR);
 const k0=p(t,.2,.7);
 [['hub',0],['d0',.08],['d1',.16],['d2',.24]].forEach(([id,d])=>{const k=eo(p(t,.2+d,.7+d));set($(id),{opacity:k,transform:`translate(-50%,-50%) scale(${.8+.2*k})`})});
 [0,1,2].forEach(i=>set($('l'+i),{opacity:eo(p(t,.5+i*.1,1.0+i*.1))}));
 [0,1,2].forEach(i=>{const [a,b]=SEG[i];const L=b-a;const el=$('i'+i);
   const appear=back(p(t,a,a+.5));
   const go=eio(p(t,a+1.3,a+2.0)); // to hub
   const x=lerp(400,HUB[0],go), y=HUB[1];
   const sc=appear*lerp(1,.12,go);
   set(el,{left:x+'px',top:y+'px',opacity:p(t,a,a+.15)*(1-p(t,a+1.9,a+2.0)),transform:`translate(-50%,-50%) scale(${sc})`});
   // route
   const pp=$('pp'+i); const r=p(t,a+2.1,a+2.8);
   const L2=pp.getTotalLength(); pp.style.strokeDasharray=L2; pp.style.strokeDashoffset=L2*(1-eio(r)); const old=t>=b; pp.setAttribute('stroke', old?'#b7e2e2':'#0e9e9e'); pp.style.opacity=r>0?1:0;
   const hit=t-(a+2.8); const lit=hit>0&&(t<b||i==2&&t>=b);
   set($('d'+i),{background:lit?'#e7f5f5':'#fff',boxShadow:`0 0 0 ${lit?Math.exp(-hit*3)*28:0}px rgba(14,158,158,.2),0 0 0 2px #e1e2e4,0 4px 20px rgba(23,35,44,.06)`});
   $('l'+i).style.color=lit?'#08090c':'#60646c';$('l'+i).style.fontWeight=lit?700:600;});
 // base grey paths under the animated ones
 const cur=SEG.findIndex(([a,b])=>t>=a&&t<b);
 if(cur>=0){const [a]=SEG[cur];const q=t-a;const hp=Math.exp(-Math.abs(q-2.0)*5);
   set($('hub'),{boxShadow:`0 0 0 ${hp*30}px rgba(14,158,158,.18),0 0 0 2px #e1e2e4,0 4px 20px rgba(23,35,44,.06)`});
   $('hub').querySelector('svg').style.transform=`rotate(${q>1.9&&q<2.4?(q-1.9)*360:0}deg)`;}
};
render(0);
</script></body></html>
