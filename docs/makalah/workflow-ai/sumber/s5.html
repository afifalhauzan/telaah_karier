<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.fd{position:absolute;width:400px;height:100px;background:#fff;border-radius:20px;box-shadow:0 0 0 2px #e1e2e4,0 4px 20px rgba(23,35,44,.06);display:flex;align-items:center;gap:18px;padding:0 24px;font-size:28px;font-weight:600;border:3px solid transparent;white-space:nowrap}
.law{position:absolute;width:700px;background:#fff;border-radius:24px;box-shadow:0 0 0 2px #e1e2e4,0 4px 20px rgba(23,35,44,.06);padding:26px 30px;border:3px solid transparent}
.law .hd{display:flex;align-items:center;gap:20px}
.law .ib{width:76px;height:76px;border-radius:20px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.law .ttl{font-size:30px;font-weight:800}
.law .ps{font-size:22px;font-weight:600;color:var(--muted);margin-top:4px}
.law .q{overflow:hidden;height:0}
.law .q div{margin-top:20px;border-left:6px solid var(--red);padding:6px 0 6px 20px;font-size:28px;font-style:italic;line-height:1.4;color:var(--ink)}
.fl{margin-left:auto}
svg#wires{position:absolute;left:0;top:0}
</style></head><body><div id="stage">
<svg id="wires" width="1920" height="1080"></svg>
<div class="fd" id="f0"></div><div class="fd" id="f1"></div><div class="fd" id="f2"></div>
<div class="law" id="L0"><div class="hd"><div class="ib"></div><div><div class="ttl">UU 13/2003 Ketenagakerjaan</div><div class="ps">Pasal 38</div></div></div><div class="q"><div>Pencari kerja tidak dipungut biaya penempatan.</div></div></div>
<div class="law" id="L1"><div class="hd"><div class="ib"></div><div><div class="ttl">UU 27/2022 Pelindungan Data Pribadi</div><div class="ps">Pasal 65</div></div></div><div class="q"><div>Memperoleh data pribadi orang lain secara melawan hukum.</div></div></div>
</div>
<script src="common.js"></script>
<script>
frame(5,'Cek aturan sinyal');
const FD=[['money','Biaya Rp150.000'],['camera','Selfie pegang KTP'],['phone','Kontak WhatsApp']];
FD.forEach((f,i)=>{const e=$('f'+i);e.innerHTML=icon(f[0],36,'#0a7f80')+`<span>${f[1]}</span><span class="fl">${icon('flag',34,'#dc2626',2.2)}</span>`;set(e,{left:'220px',top:(300+i*190)+'px'})});
const LY=[280,565];
set($('L0'),{left:'1000px',top:LY[0]+'px'});set($('L1'),{left:'1000px',top:LY[1]+'px'});
$('L0').querySelector('.ib').innerHTML=icon('scale',46,'#0a7f80',1.8);$('L1').querySelector('.ib').innerHTML=icon('lock',46,'#0a7f80',1.8);
const W=[[0,0],[1,1]];
$('wires').innerHTML=W.map(([f,l],i)=>`<path id="w${i}" d="M620 ${350+f*190} C810 ${350+f*190} 810 ${LY[l]+64} 1000 ${LY[l]+64}" stroke="#dc2626" stroke-width="5" fill="none" stroke-linecap="round"/>`).join('')+
 `<path id="w2" d="M620 730 L850 730" stroke="#e1e2e4" stroke-width="5" fill="none" stroke-dasharray="10 10"/>`;
const QH=[...document.querySelectorAll('.law .q div')].map(d=>d.offsetHeight+20);
const DUR=8;
window.render=function(t){
 frameRender(t,DUR);
 [0,1,2].forEach(i=>{const k=eo(p(t,.3+i*.15,.8+i*.15));set($('f'+i),{opacity:k,transform:`translateX(${(1-k)*-50}px)`})});
 [0,1].forEach(i=>{const k=eo(p(t,.6+i*.15,1.1+i*.15));set($('L'+i),{opacity:k,transform:`translateX(${(1-k)*50}px)`})});
 const tm=[1.5,3.6];
 W.forEach(([f,l],i)=>{const w=$('w'+i);const L=w.getTotalLength();const k=eio(p(t,tm[i],tm[i]+.7));w.style.strokeDasharray=L;w.style.strokeDashoffset=L*(1-k);
   const hit=t>=tm[i]+.7; const g=hit?Math.exp(-(t-tm[i]-.7)*3):0;
   $('f'+f).style.borderColor=hit?'#dc2626':'transparent';$('f'+f).style.background=hit?'#fef2f2':'#fff';
   set($('f'+f).querySelector('.fl'),{transform:`scale(${hit?back(p(t,tm[i]+.7,tm[i]+1.1)):0})`});
   $('L'+l).style.borderColor=hit?'#dc2626':'transparent';
   $('L'+l).querySelector('.q').style.height=(QH[l]*eio(p(t,tm[i]+.8,tm[i]+1.4)))+'px';
   set($('L'+l),{boxShadow:`0 0 0 ${g*24}px rgba(220,38,38,.15),0 0 0 2px #e1e2e4,0 4px 20px rgba(23,35,44,.06)`})});
 const k3=p(t,5.8,6.4); $('w2').style.opacity=k3>0?1:0; $('w2').setAttribute('d',`M620 730 L${lerp(620,850,eio(k3))} 730`);
 set($('f2').querySelector('.fl'),{transform:'scale(0)'}); if(t>6.4) $('f2').style.opacity=(+$('f2').style.opacity*.5).toString();
};
render(0);
</script></body></html>
