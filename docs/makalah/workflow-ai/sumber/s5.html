<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.fd{position:absolute;width:380px;height:100px;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(20,33,61,.08);display:flex;align-items:center;gap:18px;padding:0 24px;font-size:28px;font-weight:600;border:3px solid transparent}
.law{position:absolute;width:470px;white-space:nowrap;height:150px;background:#fff;border-radius:24px;box-shadow:0 14px 36px rgba(20,33,61,.10);display:flex;align-items:center;gap:22px;padding:0 28px;font-size:28px;font-weight:700}
.law .ib{width:84px;height:84px;border-radius:20px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.fl{margin-left:auto}
svg#wires{position:absolute;left:0;top:0}
</style></head><body><div id="stage">
<svg id="wires" width="1920" height="1080"></svg>
<div class="fd" id="f0"></div><div class="fd" id="f1"></div><div class="fd" id="f2"></div>
<div class="law" id="L0"><div class="ib"></div><div>UU Ketenagakerjaan<div style="font-size:20px;font-weight:500;color:#5b6478;margin-top:4px">larangan pungut biaya</div></div></div>
<div class="law" id="L1"><div class="ib"></div><div>UU PDP<div style="font-size:20px;font-weight:500;color:#5b6478;margin-top:4px">perlindungan data pribadi</div></div></div>
</div>
<script src="common.js"></script>
<script>
frame(5,'Cek aturan sinyal');
const FD=[['money','Rp150.000',0],['camera','Foto KTP',1],['phone','WhatsApp',-1]];
FD.forEach((f,i)=>{const e=$('f'+i);e.innerHTML=icon(f[0],38,'#184f95')+`<span>${f[1]}</span><span class="fl">${icon('flag',34,'#c9372c',2.2)}</span>`;set(e,{left:'180px',top:(300+i*170)+'px'})});
set($('L0'),{left:'1300px',top:'310px'});set($('L1'),{left:'1300px',top:'560px'});
$('L0').querySelector('.ib').innerHTML=icon('scale',52,'#184f95',1.8);$('L1').querySelector('.ib').innerHTML=icon('lock',52,'#184f95',1.8);
const W=[[0,0],[1,1]];
$('wires').innerHTML=W.map(([f,l],i)=>`<path id="w${i}" d="M560 ${350+f*170} C900 ${350+f*170} 1000 ${385+l*250} 1300 ${385+l*250}" stroke="#c9372c" stroke-width="5" fill="none" stroke-linecap="round"/>`).join('')+
 `<path id="w2" d="M560 690 L820 690" stroke="#d6dbe6" stroke-width="5" fill="none" stroke-dasharray="10 10"/>`;
const DUR=5.5;
window.render=function(t){
 frameRender(t,DUR);
 [0,1,2].forEach(i=>{const k=eo(p(t,.3+i*.15,.8+i*.15));set($('f'+i),{opacity:k,transform:`translateX(${(1-k)*-50}px)`})});
 [0,1].forEach(i=>{const k=eo(p(t,.6+i*.15,1.1+i*.15));set($('L'+i),{opacity:k,transform:`translateX(${(1-k)*50}px)`})});
 const tm=[1.6,2.6];
 W.forEach(([f,l],i)=>{const w=$('w'+i);const L=w.getTotalLength();const k=eio(p(t,tm[i],tm[i]+.7));w.style.strokeDasharray=L;w.style.strokeDashoffset=L*(1-k);
   const hit=t>=tm[i]+.7; const g=hit?Math.exp(-(t-tm[i]-.7)*3):0;
   $('f'+f).style.borderColor=hit?'#c9372c':'transparent';$('f'+f).style.background=hit?'#fdecea':'#fff';
   set($('f'+f).querySelector('.fl'),{transform:`scale(${hit?back(p(t,tm[i]+.7,tm[i]+1.1)):0})`});
   set($('L'+l),{boxShadow:`0 0 0 ${g*24}px rgba(201,55,44,.18),0 14px 36px rgba(20,33,61,.10)`})});
 const k3=p(t,3.6,4.2); $('w2').style.opacity=k3>0?1:0; $('w2').setAttribute('d',`M560 690 L${lerp(560,820,eio(k3))} 690`);
 set($('f2').querySelector('.fl'),{transform:'scale(0)'}); $('f2').style.opacity=(+$('f2').style.opacity*(t>4.2?.55:1)).toString();
};
render(0);
</script></body></html>
