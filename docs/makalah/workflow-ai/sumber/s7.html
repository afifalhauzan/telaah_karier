<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.it{position:absolute;height:76px;background:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(20,33,61,.08);display:flex;align-items:center;gap:14px;padding:0 20px;font-size:26px;font-weight:700}
#blk{left:600px;top:290px;width:400px;height:500px;padding:34px 30px;font-size:30px}
.br{font-family:'JetBrains Mono';font-size:60px;color:#86b6ef;font-weight:700;line-height:1}
.row{display:flex;gap:14px;align-items:center;margin:16px 0 0 26px}
.row i{display:block;height:14px;border-radius:7px}
#llm{left:1180px;top:540px;width:220px;height:220px;border-radius:50%;background:linear-gradient(135deg,#2a78d6,#184f95);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center}
#gwrap{left:1460px;top:430px;text-align:center}
#glbl{font-size:26px;font-weight:600;color:var(--muted);margin-top:8px}
</style></head><body><div id="stage">
<div id="blk" class="abs card"><div class="br">{</div><div id="rows"></div><div class="br" style="margin-top:14px">}</div></div>
<div id="llm" class="abs"></div>
<div id="gwrap" class="abs"><div id="g"></div><div id="glbl">penilaian awal</div></div>
</div>
<script src="common.js"></script>
<script>
frame(7,'Penilaian awal oleh LLM');
const IT=[['flag','Biaya','#c9372c'],['flag','KTP','#c9372c'],['globe','12 hari','#184f95'],['db','87%','#184f95'],['search','0','#184f95'],['megaphone','Bantahan','#184f95']];
const items=IT.map((x,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML=icon(x[0],32,x[2],2.2)+`<span style="color:${x[2]}">${x[1]}</span>`;$('stage').appendChild(d);return d});
const START=[[150,260],[150,370],[150,480],[150,590],[150,700],[150,810]];
$('rows').innerHTML=IT.map((x,i)=>`<div class="row" id="r${i}">${icon(x[0],28,x[2],2.2)}<i style="width:${[120,90,150,110,80,130][i]}px;background:${x[2]=='#c9372c'?'#f4c7c2':'#cde2fb'}"></i></div>`).join('');
$('llm').innerHTML=icon('spark',110,'#fff',1.8);
$('g').innerHTML=gaugeSVG('gg',380);
const DUR=6;
window.render=function(t){
 frameRender(t,DUR);
 items.forEach((d,i)=>{const k=eo(p(t,.2+i*.08,.6+i*.08));const f=eio(p(t,1.2+i*.12,1.9+i*.12));
   const r=$('r'+i).getBoundingClientRect();
   const x=lerp(START[i][0],r.left,f),y=lerp(START[i][1],r.top-24,f);
   set(d,{left:x+'px',top:y+'px',opacity:k*(1-p(t,1.75+i*.12,1.9+i*.12)),transform:`scale(${1-.3*f})`});
   set($('r'+i),{opacity:p(t,1.8+i*.12,2.0+i*.12)})});
 const bk=eo(p(t,1.0,1.4)); const go=eio(p(t,2.9,3.6));
 set($('blk'),{opacity:bk*(1-p(t,3.4,3.6)),transform:`translate(${go*480}px,${go*0}px) scale(${1-.75*go})`,transformOrigin:'center'});
 const lk=back(p(t,.6,1.1)); const pulse=t>3.5?Math.abs(Math.sin((t-3.5)*6))*Math.exp(-(t-3.5)*1.2):0;
 set($('llm'),{opacity:p(t,.6,.8),transform:`translate(-50%,-50%) scale(${lk*(1+.08*pulse)})`,boxShadow:`0 0 0 ${pulse*40}px rgba(42,120,214,.18)`});
 $('llm').querySelector('svg').style.transform=`rotate(${t>3.5?(t-3.5)*120:0}deg)`;
 const gk=eo(p(t,4.0,4.5)); set($('gwrap'),{opacity:gk,transform:`translateX(${(1-gk)*40}px)`});
 setGauge('gg',lerp(0,.85,back(p(t,4.3,5.2))));
};
render(0);
</script></body></html>
