<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
#lnk{left:150px;top:480px}
#wire{left:0;top:0}
#br{left:640px;top:220px;width:620px;height:660px;overflow:hidden}
#bar{height:60px;background:#f2f3f5;display:flex;align-items:center;padding:0 22px;gap:10px}
.d{width:14px;height:14px;border-radius:50%;background:#d4d6da}
#url{margin-left:14px;flex:1;height:36px;background:#fff;border-radius:18px;display:flex;align-items:center;padding:0 18px;font-size:19px;color:var(--muted)}
#load{position:absolute;left:0;top:60px;height:5px;background:var(--blue)}
.fld{position:absolute;left:44px;width:532px}
.fld .lb{height:14px;width:40%;border-radius:7px;background:#e1e2e4;margin-bottom:12px}
.fld .in{height:58px;border:2px solid var(--line);border-radius:12px;display:flex;align-items:center;padding:0 16px;gap:14px}
#scan{width:620px;height:6px;background:linear-gradient(90deg,transparent,var(--blue),transparent);box-shadow:0 0 22px var(--blue);border-radius:3px}
#out{left:1360px;top:250px;width:420px}
.o{display:flex;align-items:center;gap:18px;height:92px;margin-bottom:18px;background:#fff;border-radius:20px;padding:0 24px;box-shadow:0 0 0 2px #e1e2e4,0 4px 20px rgba(23,35,44,.06);border:3px solid transparent}
.o.warn{border-color:var(--red);background:#fff}
.o .w{margin-left:auto}
</style></head><body><div id="stage">
<svg id="wire" class="abs" width="1920" height="1080"><path id="wp" d="M520 520 L640 520" stroke="#0e9e9e" stroke-width="5" stroke-dasharray="12 10" fill="none"/></svg>
<div id="lnk" class="abs chip mono" style="font-size:28px;padding:14px 24px"></div>
<div id="br" class="abs card"><div id="bar"><span class="d"></span><span class="d"></span><span class="d"></span><div id="url" class="mono">daftar-majujaya.site</div></div><div id="load"></div><div id="flds"></div><div id="scan" class="abs"></div></div>
<div id="out" class="abs"></div>
</div>
<script src="common.js"></script>
<script>
frame(4,'Crawling formulir');
$('lnk').innerHTML=icon('link',30,'#0a7f80')+'bit.ly/daftar-mj';
const F=[['user',false],['phone',false],['camera',true],['bank',true]];
$('flds').innerHTML=F.map((f,i)=>`<div class="fld" id="f${i}" style="top:${110+i*130}px"><div class="lb"></div><div class="in">${icon(f[0],30,'#60646c')}</div></div>`).join('');
$('out').innerHTML=F.map((f,i)=>`<div class="o ${f[1]?'warn':''}" id="o${i}">${icon(f[0],40,f[1]?'#dc2626':'#0a7f80')}<div style="height:12px;width:${[150,120,170,160][i]}px;border-radius:6px;background:${f[1]?'#fecaca':'#cfeceb'}"></div>${f[1]?`<span class="w">${icon('flag',36,'#dc2626',2.2)}</span>`:''}</div>`).join('');
const CW=$('lnk').offsetWidth,CH=$('lnk').offsetHeight,TOT=CW+90+620+100+420,L0=(1920-TOT)/2,BX=L0+CW+90;
set($('lnk'),{left:L0+'px',top:(540-CH/2)+'px'});set($('br'),{left:BX+'px',top:'210px'});set($('out'),{left:(BX+720)+'px',top:'329px'});
const WX0=L0+CW+12,WX1=BX;
const DUR=5.5;
window.render=function(t){
 frameRender(t,DUR);
 const li=back(p(t,.2,.7)); set($('lnk'),{opacity:p(t,.2,.4),transform:`scale(${li})`});
 const w=p(t,.7,1.2); $('wp').setAttribute('d',`M${WX0} 540 L${lerp(WX0,WX1,eio(w))} 540`); $('wp').style.strokeDashoffset=-t*60; $('wp').style.opacity=w>0?1:0;
 const bi=eo(p(t,1.0,1.5)); set($('br'),{opacity:bi,transform:`scale(${.94+.06*bi})`});
 set($('load'),{width:(620*eio(p(t,1.3,2.0)))+'px',opacity:t<2.2?1:1-p(t,2.0,2.3)});
 F.forEach((_,i)=>{const k=eo(p(t,1.9+i*.12,2.3+i*.12));set($('f'+i),{opacity:k,transform:`translateY(${(1-k)*16}px)`})});
 const s=p(t,2.6,3.8); set($('scan'),{opacity:(t>2.6&&t<3.9)?1:0,top:(90+lerp(0,560,eio(s)))+'px',left:'0px'});
 F.forEach((f,i)=>{const st=2.8+i*.28;const k=eo(p(t,st,st+.45));
   set($('o'+i),{opacity:k,transform:`translateX(${(1-k)*-60}px)`});
   const inp=$('f'+i).querySelector('.in'); const hit=t>st&&t<st+.6; inp.style.borderColor=hit?(f[1]?'#dc2626':'#0e9e9e'):(t>st+.6&&f[1]?'#dc2626':'');
   const wf=f[1]?back(p(t,st+.6,st+1.0)):1; const wi=$('o'+i).querySelector('.w'); if(wi) wi.style.transform=`scale(${wf})`});
};
render(0);
</script></body></html>
