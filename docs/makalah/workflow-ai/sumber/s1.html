<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
#bub{left:330px;top:300px;width:980px;padding:50px 56px}
.r{display:flex;align-items:center;gap:22px;font-size:40px;margin-bottom:30px;color:var(--ink)}
.r:last-child{margin-bottom:0}
.r .ic{color:var(--muted)}
.sens{position:relative;display:inline-block}
.bar{position:absolute;left:-6px;top:-4px;bottom:-4px;border-radius:8px;background:#14213d;width:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#scan{left:330px;width:980px;height:6px;background:linear-gradient(90deg,transparent,var(--blue),transparent);box-shadow:0 0 22px var(--blue);border-radius:3px}
#shield{left:1400px;top:370px;width:300px;height:300px;display:flex;align-items:center;justify-content:center}
#shield .bg{position:absolute;inset:0;border-radius:50%;background:radial-gradient(closest-side,rgba(46,158,91,.25),transparent)}
</style></head><body><div id="stage">
<div id="bub" class="abs card">
 <div class="r"><span class="ic"></span>Lowongan admin, hubungi:</div>
 <div class="r"><span class="ic" data-i="phone"></span><span class="sens" id="x0">0812 3456 7890<span class="bar"></span></span></div>
 <div class="r"><span class="ic" data-i="mail"></span><span class="sens" id="x1">budi.santoso@gmail.com<span class="bar"></span></span></div>
 <div class="r"><span class="ic" data-i="id"></span>NIK&nbsp;<span class="sens mono" id="x2">3507 1234 5678 0001<span class="bar"></span></span></div>
</div>
<div id="scan" class="abs"></div>
<div id="shield" class="abs"><div class="bg"></div><span id="sh"></span></div>
</div>
<script src="common.js"></script>
<script>
frame(1,'Sensor data sensitif');
document.querySelector('#bub .r .ic').innerHTML=icon('chat',36,'#5b6478');
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=icon(e.dataset.i,36,'#5b6478'));
document.querySelectorAll('.bar').forEach(b=>b.innerHTML=icon('lock',26,'#fff',2.2));
$('sh').innerHTML=`<svg width="220" height="220" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z" fill="#2e9e5b"/><path d="m8 12 3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const DUR=5;
window.render=function(t){
 frameRender(t,DUR);
 const bi=eo(p(t,.2,.9)); set($('bub'),{opacity:bi,transform:`translateY(${(1-bi)*40}px)`});
 const s=p(t,1.1,2.6); set($('scan'),{opacity:(t>1.1&&t<2.8)?1:0,top:(300+lerp(10,380,eio(s)))+'px'});
 [0,1,2].forEach(i=>{const el=$('x'+i);const w=el.offsetWidth+12;const k=eio(p(t,1.4+i*.4,1.9+i*.4));el.querySelector('.bar').style.width=(w*k)+'px'});
 const sk=back(p(t,3.0,3.6)); set($('shield'),{opacity:p(t,3.0,3.2),transform:`scale(${sk})`});
 set($('bub'),{boxShadow:t>3.1?`0 0 0 ${6*eo(p(t,3.1,3.6))}px rgba(46,158,91,.25),0 20px 50px rgba(20,33,61,.10)`:''});
};
render(0);
</script></body></html>
